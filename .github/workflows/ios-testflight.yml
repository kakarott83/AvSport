name: iOS TestFlight

# Baut die iOS-App direkt mit Xcode auf einem macOS-Runner (nicht über
# `eas build`) und lädt sie zu TestFlight hoch. Grund: `eas build` scheitert
# aktuell am EAS-eigenen Bug beim Zertifikats-Import in der Build-Keychain
# (expo/eas-cli#3678) — das betrifft auch `eas build --local`, da dieser
# Befehl dieselbe fehlerhafte EAS-Build-Tools-Bibliothek nutzt. Dieser
# Workflow importiert Zertifikat/Profil stattdessen direkt per `security`/
# `xcodebuild` und fügt die neue Keychain explizit zur Such-Liste hinzu
# (`security list-keychain -s`) — genau das unterlässt EAS' eigener Code laut
# der verlaufsten Bug-Analyse, was dort die Ursache ist.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # Läuft bewusst als ERSTER Schritt: schlägt in Sekunden fehl statt erst
      # nach npm/prebuild/CocoaPods. Gibt nur Zeichenlängen aus, keine Werte.
      - name: Secrets prüfen
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
        run: |
          MISSING=""
          check() {
            NAME="$1"; VALUE="$2"; EXPECTED="$3"
            LEN=${#VALUE}
            if [ "$LEN" -eq 0 ]; then
              echo "  FEHLT      $NAME"
              MISSING="$MISSING $NAME"
            elif [ -n "$EXPECTED" ] && [ "$LEN" -ne "$EXPECTED" ]; then
              echo "  FALSCH     $NAME ($LEN Zeichen, erwartet $EXPECTED)"
              MISSING="$MISSING $NAME"
            else
              echo "  ok         $NAME ($LEN Zeichen)"
            fi
          }

          echo "Signierung:"
          check IOS_DIST_P12_BASE64            "$IOS_DIST_P12_BASE64"            6168
          check IOS_DIST_P12_PASSWORD          "$IOS_DIST_P12_PASSWORD"          15
          check IOS_PROVISION_PROFILE_BASE64   "$IOS_PROVISION_PROFILE_BASE64"   16288
          check ASC_API_KEY_BASE64             "$ASC_API_KEY_BASE64"             344
          check ASC_KEY_ID                     "$ASC_KEY_ID"                     10
          check ASC_ISSUER_ID                  "$ASC_ISSUER_ID"                  36
          check APPLE_TEAM_ID                  "$APPLE_TEAM_ID"                  10

          echo "App-Konfiguration:"
          check EXPO_PUBLIC_SUPABASE_URL             "$EXPO_PUBLIC_SUPABASE_URL"             ""
          check EXPO_PUBLIC_SUPABASE_ANON_KEY        "$EXPO_PUBLIC_SUPABASE_ANON_KEY"        ""
          check EXPO_PUBLIC_GEMINI_API_KEY           "$EXPO_PUBLIC_GEMINI_API_KEY"           ""
          check EXPO_PUBLIC_REVENUECAT_IOS_KEY       "$EXPO_PUBLIC_REVENUECAT_IOS_KEY"       ""
          check EXPO_PUBLIC_REVENUECAT_ANDROID_KEY   "$EXPO_PUBLIC_REVENUECAT_ANDROID_KEY"   ""

          if [ -n "$MISSING" ]; then
            echo "::error::Diese Secrets fehlen oder haben die falsche Länge:$MISSING — anzulegen unter Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          echo "Alle Secrets vorhanden."

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      # EXPO_PUBLIC_*-Variablen werden beim JS-Bundling (Teil des Xcode-Archiv-
      # Build-Schritts) fest in den Bundle eingebacken. Ohne diese Datei liefe
      # die App zwar, hätte aber keine Supabase-/Gemini-/RevenueCat-Anbindung
      # (dasselbe Problem, das wir vorhin schon beim EAS-Preview-Build hatten).
      - name: .env für den JS-Bundle-Build schreiben
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY=${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY=${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY=${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
          EOF

      - name: Natives iOS-Projekt generieren
        run: npx expo prebuild --platform ios --non-interactive

      - name: CocoaPods installieren
        run: cd ios && pod install

      # ── Signierung vorbereiten ──────────────────────────────────────────
      - name: Signierungs-Keychain anlegen und Zertifikat importieren
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          # Nur für diesen Lauf gültig, Keychain wird am Ende gelöscht —
          # braucht deshalb kein eigenes Secret.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # ── Diagnose (gibt nichts Geheimes aus: nur Längen/Prüfsummen) ──
          LEN=${#P12_BASE64}
          echo "Länge IOS_DIST_P12_BASE64: $LEN Zeichen (erwartet: 6168)"
          echo "Länge IOS_DIST_P12_PASSWORD: ${#P12_PASSWORD} Zeichen (erwartet: 15)"

          # openssl statt base64: identisches Verhalten auf jedem System,
          # keine GNU-/BSD-Flag-Unterschiede. -A = einzeilige Eingabe erlaubt.
          printf '%s' "$P12_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/dist.p12" || true

          SIZE=$(wc -c < "$RUNNER_TEMP/dist.p12" | tr -d ' ')
          ACTUAL_SHA="$(shasum -a 256 "$RUNNER_TEMP/dist.p12" | cut -d' ' -f1)"
          echo "Dekodiert: $SIZE Bytes (erwartet: 4625), SHA256 $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "1a6f4616b4a8c8e379698dd8d30d38f35c2cbde73e8b3c8b12f640e55f806e05" ]; then
            case "$LEN" in
              0)     HINT="Das Secret ist LEER — es wurde nichts gespeichert." ;;
              16288) HINT="Hier steht der Inhalt von IOS_PROVISION_PROFILE_BASE64 — die beiden Werte sind VERTAUSCHT." ;;
              344)   HINT="Hier steht der Inhalt von ASC_API_KEY_BASE64 — die Werte sind VERTAUSCHT." ;;
              6168)  HINT="Länge stimmt, Inhalt nicht — beim Kopieren wurden Zeichen verändert." ;;
              *)     HINT="Nur $LEN von 6168 Zeichen angekommen — der Wert wurde beim Einfügen abgeschnitten." ;;
            esac
            echo "::error::IOS_DIST_P12_BASE64 stimmt nicht mit der lokalen distribution.p12 überein. $HINT"
            exit 1
          fi

          # Passwort-Prüfung getrennt, damit der Fehler eindeutig zuzuordnen ist.
          openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -info -noout -passin "pass:$P12_PASSWORD" \
            || { echo "::error::p12 ist korrekt, aber IOS_DIST_P12_PASSWORD passt nicht."; exit 1; }

          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A \
            -t agg -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/dist.p12"

          # Wichtig (siehe Kommentar oben): neue Keychain explizit zur
          # Such-Liste hinzufügen, statt sie isoliert zu lassen.
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Provisioning Profile installieren
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          printf '%s' "$PROFILE_BASE64" | openssl base64 -d -A \
            -out "$PROFILE_DIR/AvoraSportApp.mobileprovision" || true

          SHA="$(shasum -a 256 "$PROFILE_DIR/AvoraSportApp.mobileprovision" | cut -d' ' -f1)"
          echo "Profile: ${#PROFILE_BASE64} Zeichen (erwartet 16288), SHA256 $SHA"
          if [ "$SHA" != "d237be271c05447fdf07c4948b938515121fb99f3f2f6b850d8bd6d5a8df2e8f" ]; then
            echo "::error::IOS_PROVISION_PROFILE_BASE64 stimmt nicht mit AvoraSportApp.mobileprovision überein (${#PROFILE_BASE64} von 16288 Zeichen angekommen)."
            exit 1
          fi

      - name: App Store Connect API Key schreiben
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf '%s' "$ASC_API_KEY_BASE64" | openssl base64 -d -A -out "$KEY_PATH" || true

          SHA="$(shasum -a 256 "$KEY_PATH" | cut -d' ' -f1)"
          echo "ASC-Key: ${#ASC_API_KEY_BASE64} Zeichen (erwartet 344), SHA256 $SHA"
          if [ "$SHA" != "29e5bab3e8a3fd8cc3f14356aadafcca91a53532cf77d060761fd7947557da63" ]; then
            echo "::error::ASC_API_KEY_BASE64 stimmt nicht mit AuthKey_4BWCLUC6DJ.p8 überein (${#ASC_API_KEY_BASE64} von 344 Zeichen angekommen)."
            exit 1
          fi

      # ── Bauen ────────────────────────────────────────────────────────────
      - name: Export-Optionen schreiben
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <!-- Bei manueller Signierung verlangt Xcode beim Export eine
                 explizite Zuordnung Bundle-ID -> Profilname, sonst:
                 "requires a provisioning profile". "AvoraSportApp" ist der
                 Name-Eintrag aus AvoraSportApp.mobileprovision. -->
            <key>provisioningProfiles</key>
            <dict>
              <key>com.avorasport.app</key>
              <string>AvoraSportApp</string>
            </dict>
          </dict>
          </plist>
          EOF

          echo "── ExportOptions.plist ──"
          cat ios/ExportOptions.plist

      - name: Archiv bauen
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios
          # Apple lehnt Uploads mit bereits vergebener Build-Nummer ab. Die
          # GitHub-Run-Nummer wächst monoton und eignet sich daher direkt als
          # Build-Nummer (CFBundleVersion). Die Marketing-Version (1.0.0)
          # bleibt davon unberührt und kommt weiter aus app.json.
          echo "Build-Nummer für diesen Lauf: ${{ github.run_number }}"
          xcodebuild archive \
            -workspace AvoraSport.xcworkspace \
            -scheme AvoraSport \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/AvoraSport.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution: Michael Lange (XN3WF5LR9U)" \
            PROVISIONING_PROFILE_SPECIFIER="AvoraSportApp" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      # `destination: upload` in ExportOptions.plist lädt in EINEM Schritt zu
      # App Store Connect hoch — kein separates altool/notarytool nötig.
      # (altool ist seit Xcode 13 deprecated; notarytool ist nur für
      # Notarisierung außerhalb des App Store gedacht, nicht für TestFlight.
      # Der von Apple aktuell empfohlene Weg für App-Store-Connect-Uploads
      # per CLI ist genau dieser `xcodebuild -exportArchive`-Aufruf mit
      # `destination: upload` + App-Store-Connect-API-Key-Authentifizierung.)
      - name: Archiv exportieren und zu TestFlight hochladen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AvoraSport.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # ── Aufräumen ────────────────────────────────────────────────────────
      - name: Schlüsselmaterial vom Runner entfernen
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -rf ~/.appstoreconnect/private_keys || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/AvoraSportApp.mobileprovision" || true
