name: iOS TestFlight

# Baut die iOS-App direkt mit Xcode auf einem macOS-Runner (nicht über
# `eas build`) und lädt sie zu TestFlight hoch. Grund: `eas build` scheitert
# aktuell am EAS-eigenen Bug beim Zertifikats-Import in der Build-Keychain
# (expo/eas-cli#3678) — das betrifft auch `eas build --local`, da dieser
# Befehl dieselbe fehlerhafte EAS-Build-Tools-Bibliothek nutzt. Dieser
# Workflow importiert Zertifikat/Profil stattdessen direkt per `security`/
# `xcodebuild` und fügt die neue Keychain explizit zur Such-Liste hinzu
# (`security list-keychain -s`) — genau das unterlässt EAS' eigener Code laut
# der verlaufsten Bug-Analyse, was dort die Ursache ist.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      # EXPO_PUBLIC_*-Variablen werden beim JS-Bundling (Teil des Xcode-Archiv-
      # Build-Schritts) fest in den Bundle eingebacken. Ohne diese Datei liefe
      # die App zwar, hätte aber keine Supabase-/Gemini-/RevenueCat-Anbindung
      # (dasselbe Problem, das wir vorhin schon beim EAS-Preview-Build hatten).
      - name: .env für den JS-Bundle-Build schreiben
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY=${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          EXPO_PUBLIC_REVENUECAT_IOS_KEY=${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY=${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
          EOF

      - name: Natives iOS-Projekt generieren
        run: npx expo prebuild --platform ios --non-interactive

      - name: CocoaPods installieren
        run: cd ios && pod install

      # ── Signierung vorbereiten ──────────────────────────────────────────
      - name: Signierungs-Keychain anlegen und Zertifikat importieren
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          # Nur für diesen Lauf gültig, Keychain wird am Ende gelöscht —
          # braucht deshalb kein eigenes Secret.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # ── Diagnose (gibt nichts Geheimes aus: nur Längen/Prüfsummen) ──
          echo "Länge des Base64-Secrets: ${#P12_BASE64} Zeichen (erwartet: 6168)"
          echo "Länge des Passwort-Secrets: ${#P12_PASSWORD} Zeichen (erwartet: 15)"

          # openssl statt base64: identisches Verhalten auf jedem System,
          # keine GNU-/BSD-Flag-Unterschiede. -A = einzeilige Eingabe erlaubt.
          printf '%s' "$P12_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/dist.p12"

          echo "Dekodierte Datei: $(wc -c < "$RUNNER_TEMP/dist.p12") Bytes (erwartet: 4625)"
          ACTUAL_SHA="$(shasum -a 256 "$RUNNER_TEMP/dist.p12" | cut -d' ' -f1)"
          EXPECTED_SHA="1a6f4616b4a8c8e379698dd8d30d38f35c2cbde73e8b3c8b12f640e55f806e05"
          echo "SHA256 dekodiert: $ACTUAL_SHA"
          echo "SHA256 erwartet : $EXPECTED_SHA"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Das Secret IOS_DIST_P12_BASE64 entspricht NICHT der lokalen distribution.p12 — Wert wurde unvollständig/falsch eingefügt."
            exit 1
          fi

          # Passwort-Prüfung getrennt, damit der Fehler eindeutig zuzuordnen ist.
          openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -info -noout -passin "pass:$P12_PASSWORD" \
            || { echo "::error::p12 ist korrekt, aber IOS_DIST_P12_PASSWORD passt nicht."; exit 1; }

          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A \
            -t agg -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/dist.p12"

          # Wichtig (siehe Kommentar oben): neue Keychain explizit zur
          # Such-Liste hinzufügen, statt sie isoliert zu lassen.
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Provisioning Profile installieren
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 -D -o "$PROFILE_DIR/AvoraSportApp.mobileprovision"

      - name: App Store Connect API Key schreiben
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_BASE64" | base64 -D \
            -o ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # ── Bauen ────────────────────────────────────────────────────────────
      - name: Export-Optionen schreiben
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF

      - name: Archiv bauen
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios
          xcodebuild archive \
            -workspace AvoraSport.xcworkspace \
            -scheme AvoraSport \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/AvoraSport.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution: Michael Lange (XN3WF5LR9U)" \
            PROVISIONING_PROFILE_SPECIFIER="AvoraSportApp" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      # `destination: upload` in ExportOptions.plist lädt in EINEM Schritt zu
      # App Store Connect hoch — kein separates altool/notarytool nötig.
      # (altool ist seit Xcode 13 deprecated; notarytool ist nur für
      # Notarisierung außerhalb des App Store gedacht, nicht für TestFlight.
      # Der von Apple aktuell empfohlene Weg für App-Store-Connect-Uploads
      # per CLI ist genau dieser `xcodebuild -exportArchive`-Aufruf mit
      # `destination: upload` + App-Store-Connect-API-Key-Authentifizierung.)
      - name: Archiv exportieren und zu TestFlight hochladen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AvoraSport.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # ── Aufräumen ────────────────────────────────────────────────────────
      - name: Schlüsselmaterial vom Runner entfernen
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -rf ~/.appstoreconnect/private_keys || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/AvoraSportApp.mobileprovision" || true
